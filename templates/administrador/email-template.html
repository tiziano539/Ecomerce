<table style="width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; border: 1px solid #ddd;">
    <tr>
        <td colspan="2" style="padding: 15px; background-color: #2c3e50; color: #ffffff; text-align: center; font-weight: bold; font-size: 18px;">
            Nuevo Mensaje de Contacto
        </td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 12px; font-weight: bold; background-color: #f8f9fa; width: 35%;">Nombre y Apellido</td>
        <td style="padding: 12px; color: #333;">{{ nombre }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 12px; font-weight: bold; background-color: #f8f9fa;">Correo Electrónico</td>
        <td style="padding: 12px; color: #333;">{{ email }}</td>
    </tr>
    <tr style="border-bottom: 1px solid #ddd;">
        <td style="padding: 12px; font-weight: bold; background-color: #f8f9fa;">Asunto</td>
        <td style="padding: 12px; color: #333;">{{ asunto }}</td>
    </tr>
    <tr>
        <td style="padding: 12px; font-weight: bold; background-color: #f8f9fa; vertical-align: top;">Mensaje</td>
        <td style="padding: 12px; color: #333; line-height: 1.5;">{{ mensaje }}</td>
    </tr>
</table>
