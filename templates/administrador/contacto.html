{% extends "administrador/index.html" %}
{% load static %}

{% block title %}
Contacto - Autopartes UDOTEC
{% endblock %}

{% block codigoDinamico %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 p-4">
                <h2 class="mb-4 fw-bold">Contacto y Consultas Técnicas</h2>
                
                <form method="POST" novalidate>
                    {% csrf_token %}
                    
                    <!-- Campo Nombre -->
                    <div class="mb-3">
                        <label for="{{ form.nombre.id_for_label }}" class="form-label fw-semibold">Nombre:</label>
                        {{ form.nombre }}
                    </div>
                    
                    <!-- Campo Email -->
                    <div class="mb-3">
                        <label for="{{ form.email.id_for_label }}" class="form-label fw-semibold">Correo electrónico:</label>
                        {{ form.email }}
                    </div>
                    
                    <!-- Campo Mensaje -->
                    <div class="mb-3">
                        <label for="{{ form.mensaje.id_for_label }}" class="form-label fw-semibold">Mensaje:</label>
                        {{ form.mensaje }}
                    </div>
                    
                    <!-- Botón Enviar con over padding -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn text-white py-2 fw-semibold" style="background-color: #ff6600; border-color: #ff6600;">
                            Enviar Mensaje
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    {% if messages %}
        {% for message in messages %}
            {% if message.tags == 'success' %}
                toastr.success('{{ message|escapejs }}');
            {% elif message.tags == 'error' %}
                toastr.error('{{ message|escapejs }}');
            {% elif message.tags == 'warning' %}
                toastr.warning('{{ message|escapejs }}');
            {% elif message.tags == 'info' %}
                toastr.info('{{ message|escapejs }}');
            {% endif %}
        {% endfor %}
    {% endif %}
</script>
{% endblock %}
